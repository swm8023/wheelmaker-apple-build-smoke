name: WheelMaker iPad Ad Hoc build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive and export the signed iPad build
        env:
          WM_ADHOC_SETTINGS: ${{ secrets.WM_IPAD_ADHOC_BUILD }}
        run: bash signing/build-ios-adhoc.sh
      - name: Upload encrypted build result
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheelmaker-ipad-encrypted-result
          path: ${{ runner.temp }}/WheelMaker-iPad-build.enc
          if-no-files-found: error
          retention-days: 1

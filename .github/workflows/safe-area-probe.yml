name: Verify iPhone workspace background and keyboard
on:
  push:
    branches: [test/ios-workspace-layout-probe]
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile standalone SwiftUI and WebKit fixture
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/SafeAreaProbe.app"
          mkdir -p "$app"
          cat > "$app/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>example.safeareaprobe</string>
          <key>CFBundleExecutable</key><string>SafeAreaProbe</string>
          <key>CFBundleName</key><string>SafeAreaProbe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>MinimumOSVersion</key><string>26.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UIApplicationSceneManifest</key><dict><key>UIApplicationSupportsMultipleScenes</key><false/></dict>
          <key>UILaunchScreen</key><dict/>
          <key>UISupportedInterfaceOrientations</key><array>
          <string>UIInterfaceOrientationPortrait</string>
          <string>UIInterfaceOrientationPortraitUpsideDown</string>
          <string>UIInterfaceOrientationLandscapeLeft</string>
          <string>UIInterfaceOrientationLandscapeRight</string>
          </array>
          </dict></plist>
          PLIST
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -parse-as-library -sdk "$sdk" -target "$(uname -m)-apple-ios26.0-simulator" safe-area-probe/Probe.swift -o "$app/SafeAreaProbe"
          codesign --force --sign - "$app"
      - name: Verify background colors and keyboard on iPhone
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime, ds in reversed(list(json.load(sys.stdin)["devices"].items())) if ".iOS-" in runtime for d in ds if d["name"] == "iPhone 17 Pro" and d["isAvailable"]))')"
          xcrun simctl list devices available | grep "$device"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/SafeAreaProbe.app"
          swiftc safe-area-probe/Sample.swift -o "$RUNNER_TEMP/sample-color"
          python3 - "$device" <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          device, bundle = sys.argv[1], "example.safeareaprobe"
          def simctl(*args, **kwargs):
              return subprocess.run(["xcrun", "simctl", *args], check=True, timeout=60, **kwargs)
          data = Path(simctl("get_app_container", device, bundle, "data", capture_output=True, text=True).stdout.strip())
          result = data / "Documents" / "result.json"
          phase = data / "Documents" / "phase.txt"
          temp = Path(os.environ["RUNNER_TEMP"])
          reference = None
          for mode in ("baseline", "light", "dark", "keyboard"):
              phase.unlink(missing_ok=True)
              result.unlink(missing_ok=True)
              simctl("launch", "--terminate-running-process", device, bundle,
                     env={**os.environ, "SIMCTL_CHILD_SAFE_AREA_MODE": mode})
              deadline = time.monotonic() + 65
              latest = None
              while latest != "complete" and time.monotonic() < deadline:
                  current = phase.read_text() if phase.is_file() else None
                  if current != latest:
                      print(mode, current, flush=True)
                      latest = current
                  if current and current.startswith("error:"):
                      break
                  time.sleep(0.25)
              assert result.is_file() and latest == "complete", (mode, latest)
              geometry = json.loads(result.read_text())
              print("SAFE_AREA_RESULT " + result.read_text(), flush=True)
              # Contents retain their single system inset while the background fills the window.
              frame = [geometry[x] for x in ("webTop", "webBottom", "webHeight")]
              if mode == "baseline":
                  reference = frame
              assert frame == reference
              assert geometry["webTop"] == geometry["windowSafeTop"]
              assert geometry["window"] - geometry["webBottom"] == geometry["windowSafeBottom"]
              if mode == "keyboard":
                  keyboard = json.loads((data / "Documents" / "keyboard.json").read_text())
                  print("KEYBOARD_RESULT " + json.dumps(keyboard), flush=True)
                  assert keyboard["initial"] - keyboard["open"] > 150, keyboard
                  assert abs(keyboard["closed"] - keyboard["initial"]) < 1, keyboard
                  continue
              screenshot = temp / (mode + ".png")
              simctl("io", device, "screenshot", str(screenshot))
              colors = subprocess.check_output([str(temp / "sample-color"), str(screenshot)], text=True).split()
              print("BACKGROUND_RESULT", mode, colors, flush=True)
              if mode == "baseline":
                  assert colors[0] != colors[1] or colors[2] != colors[1]
              else:
                  assert colors[0] == colors[1] == colors[2], colors
          PY

name: Verify iPhone native inset and keyboard recovery
on:
  push:
    branches: [test/ios-chat-keyboard-anchor-probe]
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile standalone SwiftUI and WebKit fixture
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/SafeAreaProbe.app"
          mkdir -p "$app"
          cat > "$app/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>example.safeareaprobe</string>
          <key>CFBundleExecutable</key><string>SafeAreaProbe</string>
          <key>CFBundleName</key><string>SafeAreaProbe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>MinimumOSVersion</key><string>26.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UIApplicationSceneManifest</key><dict><key>UIApplicationSupportsMultipleScenes</key><false/></dict>
          <key>UILaunchScreen</key><dict/>
          <key>UISupportedInterfaceOrientations</key><array>
          <string>UIInterfaceOrientationPortrait</string>
          <string>UIInterfaceOrientationPortraitUpsideDown</string>
          <string>UIInterfaceOrientationLandscapeLeft</string>
          <string>UIInterfaceOrientationLandscapeRight</string>
          </array>
          </dict></plist>
          PLIST
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -parse-as-library -sdk "$sdk" -target "$(uname -m)-apple-ios26.0-simulator" safe-area-probe/Probe.swift -o "$app/SafeAreaProbe"
          codesign --force --sign - "$app"
      - name: Open and dismiss the keyboard from a WebView editor
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime, ds in reversed(list(json.load(sys.stdin)["devices"].items())) if ".iOS-" in runtime for d in ds if d["name"] == "iPhone 17 Pro" and d["isAvailable"]))')"
          xcrun simctl list devices available | grep "$device"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          bundle=example.safeareaprobe
          xcrun simctl install "$device" "$RUNNER_TEMP/SafeAreaProbe.app"
          data="$(xcrun simctl get_app_container "$device" "$bundle" data)"
          result="$data/Documents/result.json"
          for mode in compact; do
            rm -f "$result"
            SIMCTL_CHILD_PROBE_BOTTOM_ANCHOR="$mode" xcrun simctl launch --terminate-running-process "$device" "$bundle"
            for attempt in $(seq 1 80); do
              if [[ -f "$result" ]]; then break; fi
              sleep 1
            done
            python3 - "$mode" "$result" <<'PY'
          import json
          import sys
          from pathlib import Path

          mode = sys.argv[1]
          report = json.loads(Path(sys.argv[2]).read_text())
          print("ANCHOR_RESULT " + json.dumps({"mode": mode, **report}, sort_keys=True), flush=True)
          assert "error" not in report, report
          cycles = report["cycles"]
          assert len(cycles) == 3, report
          first = cycles[0]["before"]
          assert abs(first["webTop"] - max(0, first["windowSafeTop"] - 4)) < 1, first
          resting_bottom = first["windowHeight"] - max(0, first["windowSafeBottom"] - 4)
          assert abs(first["webBottom"] - resting_bottom) < 1, first
          assert first["webTop"] + first["page"]["headerContentTop"] >= first["windowSafeTop"], first
          assert first["webTop"] + first["page"]["editorBottom"] <= first["windowHeight"] - first["windowSafeBottom"], first
          initial_gap = first["page"]["editorGapToVisualBottom"]
          assert initial_gap == 6, first
          for cycle in cycles:
              opened, closed = cycle["open"], cycle["settled"]
              assert opened["page"]["editorFocused"] and not closed["page"]["editorFocused"], cycle
              assert first["webHeight"] - opened["webHeight"] > 150, cycle
              assert abs(opened["page"]["visualHeight"] - opened["webHeight"]) < 1, cycle
              assert abs(opened["page"]["editorGapToVisualBottom"] - initial_gap) < 1, cycle
              assert abs(resting_bottom - closed["webBottom"]) < 1, cycle
              assert abs(first["webHeight"] - closed["webHeight"]) < 1, cycle
              assert abs(closed["page"]["editorGapToVisualBottom"] - initial_gap) < 1, cycle
              print(f'{mode} cycle {cycle["cycle"]}: height {opened["webHeight"]}/{closed["webHeight"]}, '
                    f'gap {opened["page"]["editorGapToVisualBottom"]}/{closed["page"]["editorGapToVisualBottom"]}', flush=True)
          PY
          done
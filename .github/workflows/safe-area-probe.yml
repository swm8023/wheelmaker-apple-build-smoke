name: Measure iPhone WebView chat keyboard geometry
on:
  push:
    branches: [test/ios-chat-keyboard-probe]
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Tap the editor and then the transcript on iPhone
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime, ds in reversed(list(json.load(sys.stdin)["devices"].items())) if ".iOS-" in runtime for d in ds if d["name"] == "iPhone 17 Pro" and d["isAvailable"]))')"
          xcrun simctl list devices available | grep "$device"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$device"

          export HOMEBREW_NO_AUTO_UPDATE=1
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd safe-area-probe && xcodegen generate --spec tap-project.yml)
          xcrun simctl bootstatus "$device" -b

          test_status=0
          xcodebuild -project safe-area-probe/SafeAreaProbe.xcodeproj -scheme SafeAreaProbe \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/wm-probe" CODE_SIGNING_ALLOWED=NO test || test_status=$?
          if data="$(xcrun simctl get_app_container "$device" example.safeareaprobe data 2>/dev/null)" \
              && [[ -f "$data/Documents/result.json" ]]; then
            python3 - "$data/Documents/result.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())
          print("PROBE_RESULT " + json.dumps(report, sort_keys=True), flush=True)
          assert "error" not in report, report
          for cycle in report["cycles"]:
              before, opened, settled = [cycle[phase] for phase in ("before", "open", "settled")]
              assert opened["page"]["editorFocused"] and not settled["page"]["editorFocused"], cycle
              assert before["webHeight"] - opened["webHeight"] > 150, cycle
              print(
                  f'{cycle["mode"]} cycle {cycle["cycle"]}: '
                  f'WebView height {before["webHeight"]} → {opened["webHeight"]} → {settled["webHeight"]}, '
                  f'editor gap {before["page"]["editorGapToVisualBottom"]} → '
                  f'{opened["page"]["editorGapToVisualBottom"]} → {settled["page"]["editorGapToVisualBottom"]}',
                  flush=True,
              )
          PY
          elif [[ "$test_status" -eq 0 ]]; then
            echo "XCUITest did not produce a geometry report" >&2
            exit 1
          fi
          exit "$test_status"

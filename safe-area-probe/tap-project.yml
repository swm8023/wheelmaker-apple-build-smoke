name: SafeAreaProbe
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  SafeAreaProbe:
    type: application
    platform: iOS
    sources: [Probe.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.safeareaprobe
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SafeAreaProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ChatTapTests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.safeareaprobe.uitests
        TEST_TARGET_NAME: SafeAreaProbe
    dependencies:
      - target: SafeAreaProbe
schemes:
  SafeAreaProbe:
    build:
      targets:
        SafeAreaProbe: all
    test:
      targets: [SafeAreaProbeUITests]
